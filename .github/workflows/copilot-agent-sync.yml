name: copilot-agent-sync

# "Two birds, one stone": this exercises GitHub Copilot CLI for real (headless,
# in CI) AND uses it to catch drift between our canonical Kiro agent and its
# hand-ported Copilot-native sibling, since Copilot itself is the one that can
# actually read and judge whether a prose translation is still faithful.
#
# Setup Dean needs to do once (nothing in this repo can do this step):
#   1. Create a fine-grained personal access token at
#      https://github.com/settings/personal-access-tokens/new
#      - Resource owner: your personal account (not an org)
#      - Repository access: this repo (or public repos) is enough
#      - Account permissions -> "Copilot Requests": Read-only
#   2. Add it as a repo secret named COPILOT_CLI_TOKEN
#      (Settings -> Secrets and variables -> Actions -> New repository secret)
# Until that secret exists, this workflow will fail at the auth step, loudly,
# rather than silently no-op — that's intentional so the gap is visible.
#
# Security posture, verified against this repo's actual live settings and
# GitHub's documented behavior (not assumed):
#   - Trigger is `pull_request`, never `pull_request_target` - the second one
#     is the genuinely dangerous trigger GitHub's own hardening docs warn
#     about (it runs with base-repo secrets against untrusted fork code).
#   - GitHub withholds repository secrets from any pull_request-triggered run
#     originating from a fork by default; this repo has not overridden that.
#     A stranger's fork PR touching these files would see COPILOT_CLI_TOKEN
#     as empty even without the job-level `if` below.
#   - The `if` below is explicit, defense-in-depth belt-and-braces on top of
#     that default: it skips the job entirely — no checkout, no npm install,
#     no attempt to run Copilot — for anything that isn't a same-repo PR (i.e.
#     opened by Dean or another writer, not a fork) or a manual dispatch.
#     This also avoids showing a confusing failing check on a good-faith
#     outside contributor's PR.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "agents/kiro/laravel-warrior.json"
      - "agents/copilot/laravel-warrior.agent.md"

jobs:
  check-sync:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot
      - name: Ask Copilot to judge whether the two agents are still in sync
        id: check
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_CLI_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${COPILOT_GITHUB_TOKEN:-}" ]; then
            echo "::error::COPILOT_CLI_TOKEN secret is not set — see the setup comment at the top of this workflow file."
            exit 1
          fi
          # Known bug (github/copilot-cli#3396): the CLI can pick up an ambient
          # GH_TOKEN/GITHUB_TOKEN (an Actions installation token, prefix ghs_)
          # instead of COPILOT_GITHUB_TOKEN and fail with this exact opaque
          # "Authentication failed" error. Report their presence (name only,
          # never the value) and unset them so COPILOT_GITHUB_TOKEN can't lose
          # that race, whether or not this specific run turns out to need it.
          if [ -n "${GH_TOKEN:-}" ]; then echo "GH_TOKEN set: yes"; else echo "GH_TOKEN set: no"; fi
          if [ -n "${GITHUB_TOKEN:-}" ]; then echo "GITHUB_TOKEN set: yes"; else echo "GITHUB_TOKEN set: no"; fi
          unset GH_TOKEN GITHUB_TOKEN
          copilot -p "$(cat <<'PROMPT'
          Compare these two files:
          - agents/kiro/laravel-warrior.json (the "prompt" field is the canonical rules)
          - agents/copilot/laravel-warrior.agent.md (a hand-ported translation for GitHub
            Copilot CLI's own agent format — it necessarily rewrites Kiro-specific tool
            names like `knowledge`/`todo`/`thinking`/`delegate` into harness-neutral
            prose, so wording will differ; that is expected, not drift)

          Read both files. Judge only whether the SUBSTANCE of every numbered rule in
          the Kiro file is still present, in intent, somewhere in the Copilot file — not
          whether the wording matches. Ignore frontmatter and the closing sentence about
          what model/harness the agent runs on.

          Reply with exactly one of these two forms, nothing else:
          SYNC_OK
          or
          SYNC_DRIFT: <one sentence per missing or contradicted rule, citing the rule number>
          PROMPT
          )" \
            -s \
            --model=claude-sonnet-4.6 \
            --allow-tool='read' \
            --no-ask-user \
            --secret-env-vars=COPILOT_GITHUB_TOKEN > copilot-output.txt
          cat copilot-output.txt
          if grep -q '^SYNC_OK' copilot-output.txt; then
            echo "in sync"
            exit 0
          fi
          echo "::error::laravel-warrior.json and laravel-warrior.agent.md have drifted — see Copilot's report above."
          exit 1
